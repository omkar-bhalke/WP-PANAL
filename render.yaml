services:
  - type: web
    name: wa-multi-panel
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    disk:
      name: wa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # Render dashboard mein apna password set karo
      - key: DATA_DIR
        value: /data       # sab kuch yahan store hoga — accounts, sessions, WA auth
      - key: NODE_ENV
        value: production
